name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Quran data
        run: python3 tools/fetch_quran.py android/app/src/main/assets

      - name: Check reciter URLs
        continue-on-error: true
        run: |
          for r in Alafasy_128kbps Abdurrahmaan_As-Sudais_192kbps MaherAlMuaiqly128kbps Husary_128kbps Abdul_Basit_Murattal_192kbps Minshawy_Murattal_128kbps; do
            echo "$r -> $(curl -s -o /dev/null -w '%{http_code}' https://everyayah.com/data/$r/001001.mp3) / $(curl -s -o /dev/null -w '%{http_code}' https://everyayah.com/data/$r/114006.mp3)"
          done

      - name: Build APK with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ./android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
