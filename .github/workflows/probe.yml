name: Probe data sources
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          B=https://api.quran.com/api/v4
          echo "== roman 831 samples"
          for k in 1:2 2:30 112:1; do curl -s "$B/verses/by_key/$k?translations=831" | python3 -c "import json,sys; print(json.load(sys.stdin)['verse']['translations'][0]['text'][:600])"; done
          echo "== all tafsirs"
          curl -s "$B/resources/tafsirs" | python3 -c "
          import json,sys
          for t in json.load(sys.stdin)['tafsirs']: print(t['id'], t['language_name'], '|', t['name'], '|', t.get('author_name'))
          "
          echo "== hindi wbw sample 2:30"
          curl -s "$B/verses/by_key/2:30?words=true&language=hi" | python3 -c "
          import json,sys
          print(' / '.join((w.get('translation') or {}).get('text','') for w in json.load(sys.stdin)['verse']['words']))
          "
